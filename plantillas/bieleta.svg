<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" font-family="Inter, Arial, sans-serif" role="img" aria-label="La bieleta: ojo redondo con tornillo al balancín y ojo en C que se engancha en el perno del dedo">
<rect width="900" height="250" fill="#fafafa"/>
<text x="24" y="34" font-size="20" font-weight="700">Las bieletas: un ojo con tornillo y un ojo que se ENGANCHA</text>
<text x="24" y="58" font-size="13" fill="#555">Las 4 bieletas (P30–P33) son idénticas: cualquiera va en cualquier dedo.</text>
<rect x="200" y="120" width="360" height="26" rx="13" fill="#2b2d31"/>
<circle cx="213" cy="133" r="28" fill="#2b2d31"/><circle cx="213" cy="133" r="9" fill="#fafafa"/>
<path d="M547 105 a 30 30 0 1 1 0 56" fill="none" stroke="#2b2d31" stroke-width="22"/>
<circle cx="580" cy="133" r="13" fill="#E8822A" stroke="#0c0c0c" stroke-width="1.5"/><text x="580" y="186" font-size="12" text-anchor="middle">perno Ø3 de la palanca del dedo</text>
<text x="213" y="190" font-size="12" text-anchor="middle">ojo redondo: tornillo M2 × 6</text><text x="213" y="206" font-size="12" text-anchor="middle">desde arriba, se rosca en el balancín</text>
<path d="M680 133 H630" stroke="#E8822A" stroke-width="4"/><path d="M630 133 l12 -8 v16 z" fill="#E8822A"/>
<text x="690" y="118" font-size="13" font-weight="700">Empuja de lado</text><text x="690" y="136" font-size="13">hasta que haga «clic».</text><text x="690" y="154" font-size="12" fill="#555">Sin tornillo. Si queda floja: una gota</text><text x="690" y="170" font-size="12" fill="#555">de pegamento en el PERNO, no en el ojo.</text>
</svg>